xt x="170" y="640" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#172b4d" text-anchor="middle" font-weight="700">Usuario de</text><text x="170" y="673" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#172b4d" text-anchor="middle" font-weight="700">consola</text><g id="UC03"><ellipse cx="765" cy="300" rx="255" ry="65" fill="#eaf1fb" stroke="#334155" stroke-width="2.8"/><text x="765" y="276" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#172b4d" text-anchor="middle" font-weight="600">Suscribir jugador</text><text x="765" y="310" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#172b4d" text-anchor="middle" font-weight="600">a la torre</text><text x="765" y="343" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172b4d" text-anchor="middle">UC03 · opción 3</text></g><g id="UC04"><ellipse cx="765" cy="515" rx="255" ry="65" fill="#eaf1fb" stroke="#334155" stroke-width="2.8"/><text x="765" y="507" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#172b4d" text-anchor="middle" font-weight="600">Desuscribir jugador</text><text x="765" y="543" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172b4d" text-anchor="middle">UC04 · opción 4</text></g><g id="UC05"><ellipse cx="765" cy="730" rx="255" ry="65" fill="#eaf1fb" stroke="#334155" stroke-width="2.8"/><text x="765" y="722" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#172b4d" text-anchor="middle" font-weight="600">Detectar enemigo</text><text x="765" y="758" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172b4d" text-anchor="middle">UC05 · opción 5</text></g><g id="UC05A"><ellipse cx="1455" cy="730" rx="255" ry="65" fill="#e5f4ee" stroke="#334155" stroke-width="2.8"/><text x="1455" y="706" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#172b4d" text-anchor="middle" font-weight="600">Notificar a observadores</text><text x="1455" y="740" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#172b4d" text-anchor="middle" font-weight="600">suscritos</text><text x="1455" y="773" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172b4d" text-anchor="middle">UC05A</text></g><text x="50" y="968" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#172b4d" font-weight="600">Detectar un enemigo siempre invoca notificar(); solo reaccionan los observadores registrados.</text><text x="50" y="1002" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172b4d" >Línea continua: asociación actor–caso de uso · flecha discontinua «include»: comportamiento incluido obligatorio.</text></svg>