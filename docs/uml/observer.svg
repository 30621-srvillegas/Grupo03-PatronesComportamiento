<text x="53" y="82" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#64748b">Grupo 3 · Videojuego RPG · Estado del código: feature/observer-alerta</text><path d="M 290 470 L 290 315" fill="none" stroke="#475569" stroke-width="2.3" stroke-dasharray="10 7" marker-end="url(#realization)"/><path d="M 1080 470 L 1080 261" fill="none" stroke="#475569" stroke-width="2.3" stroke-dasharray="10 7" marker-end="url(#realization)"/><path d="M 540 236 H 855" fill="none" stroke="#475569" stroke-width="2.3" stroke-dasharray="10 7" marker-end="url(#navigable)"/><text x="610" y="224" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#334155">usa IObservador en parámetros</text><path d="M 578 576 H 704 V 338 H 804 V 181 H 855" fill="none" stroke="#475569" stroke-width="2.3" marker-end="url(#navigable)"/><polygon points="545,576 561,565 578,576 561,587" fill="#fff" stroke="#475569" stroke-width="2.3"/><text x="700" y="320" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#334155">observadores</text><text x="704" y="342" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#334155">0..*</text><g><rect x="45" y="135" width="495" height="180" rx="9" fill="#ffffff" stroke="#64748b" stroke-width="1.8"/><rect x="45" y="135" width="495" height="74" rx="9" fill="#eff6ff"/><path d="M45 201 h495" stroke="#bfdbfe" stroke-width="0"/><text x="292.5" y="161" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-style="italic" fill="#475569">«interface»</text><text x="292.5" y="189" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">ISujeto</text><line x1="45" y1="221" x2="540" y2="221" stroke="#cbd5e1" stroke-width="1.4"/><text x="62" y="247" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="13.5" fill="#1e293b">+ suscribir(observador: IObservador): void</text><text x="62" y="274" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="13.5" fill="#1e293b">+ desuscribir(observador: IObservador): void</text><text x="62" y="301" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="13.5" fill="#1e293b">+ notificar(): void</text></g><g><rect x="855" y="135" width="460" height="126" rx="9" fill="#ffffff" stroke="#64748b" stroke-width="1.8"/><rect x="855" y="135" width="460" height="74" rx="9" fill="#eff6ff"/><path d="M855 201 h460" stroke="#bfdbfe" stroke-width="0"/><text x="1085" y="161" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-style="italic" fill="#475569">«interface»</text><text x="1085" y="189" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">IObservador</text><line x1="855" y1="221" x2="1315" y2="221" stroke="#cbd5e1" stroke-width="1.4"/><text x="872" y="247" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="13.5" fill="#1e293b">+ actualizar(): void</text></g><g><rect x="45" y="470" width="500" height="214" rx="9" fill="#ffffff" stroke="#64748b" stroke-width="1.8"/><rect x="45" y="470" width="500" height="54" rx="9" fill="#eff6ff"/><path d="M45 516 h500" stroke="#bfdbfe" stroke-width="0"/><text x="295" y="503" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">TorreDeVigilancia</text><text x="62" y="548" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="13.5" fill="#334155">- observadores: List&lt;IObservador&gt;</text><line x1="45" y1="563" x2="545" y2="563" stroke="#cbd5e1" stroke-width="1.4"/><text x="62" y="589" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="13.5" fill="#1e293b">+ suscribir(observador: IObservador): void</text><text x="62" y="616" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="13.5" fill="#1e293b">+ desuscribir(observador: IObservador): void</text><text x="62" y="643" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="13.5" fill="#1e293b">+ notificar(): void</text><text x="62" y="670" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="13.5" fill="#1e293b">+ detectarEnemigo(): void</text></g><g><rect x="855" y="470" width="460" height="214" rx="9" fill="#ffffff" stroke="#64748b" stroke-width="1.8"/><rect x="855" y="470" width="460" height="54" rx="9" fill="#eff6ff"/><path d="M855 516 h460" stroke="#bfdbfe" stroke-width="0"/><text x="1085" y="503" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">Jugador</text><text x="872" y="548" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="13.5" fill="#334155">- nombre: String</text><line x1="855" y1="563" x2="1315" y2="563" stroke="#cbd5e1" stroke-width="1.4"/><text x="872" y="589" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="13.5" fill="#1e293b">+ Jugador(nombre: String)</text><text x="872" y="616" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="13.5" fill="#1e293b">+ getNombre(): String</text><text x="872" y="643" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="13.5" fill="#1e293b">+ actualizar(): void</text><text x="872" y="670" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="13.5" fill="#1e293b">+ activarEscudo(): void</text></g><rect x="45" y="725" width="1275" height="95" rx="10" fill="#f8fafc" stroke="#e2e8f0"/><text x="64" y="757" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#334155">1 TorreDeVigilancia mantiene 0..* suscriptores IObservador (agregación compartida).</text><text x="64" y="782" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#334155">detectarEnemigo() → notificar() → actualizar() → activarEscudo().</text><text x="64" y="806" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#334155">Jugador y TorreDeVigilancia realizan las interfaces; el sujeto no depende de la clase concreta Jugador.</text></svg>